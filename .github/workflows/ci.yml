name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://flowapprove:flowapprove@localhost:5433/flowapprove
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: flowapprove
          POSTGRES_PASSWORD: flowapprove
          POSTGRES_DB: flowapprove
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U flowapprove -d flowapprove"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just setup
      - run: just migrate
      - run: just lint
      - run: npm test
      - run: npm run build

  # Builds the app and migrate images and pushes them to GitHub Container Registry.
  images:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-app:${{ github.sha }}
            ghcr.io/${{ github.repository }}-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-migrate:${{ github.sha }}
            ghcr.io/${{ github.repository }}-migrate:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  # Migrates, then rolls out the new images to Azure Container Apps. Skipped until the repo
  # variables exist (from `just infra output github_variables`). Signs in with a federated
  # credential that only this repo's main branch can use: no Azure keys are stored anywhere.
  deploy:
    needs: images
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_IMAGE: ghcr.io/${{ github.repository }}-app:${{ github.sha }}
      MIGRATE_IMAGE: ghcr.io/${{ github.repository }}-migrate:${{ github.sha }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Migrate the database
        env:
          JOB: ${{ vars.MIGRATE_JOB }}
        run: |
          az containerapp job update -n "$JOB" -g "$RG" --image "$MIGRATE_IMAGE" -o none
          run=$(az containerapp job start -n "$JOB" -g "$RG" --query name -o tsv)
          for i in $(seq 60); do
            status=$(az containerapp job execution show -n "$JOB" -g "$RG" --job-execution-name "$run" --query properties.status -o tsv)
            echo "migration: $status"
            [ "$status" = "Succeeded" ] && exit 0
            [ "$status" = "Failed" ] && exit 1
            sleep 10
          done
          echo "migration timed out"; exit 1
      - name: Deploy
        env:
          APP: ${{ vars.CONTAINER_APP }}
        run: |
          az containerapp update -n "$APP" -g "$RG" --image "$APP_IMAGE" -o none
          az containerapp job update -n "${APP/ca-/caj-}-reset" -g "$RG" --image "$APP_IMAGE" -o none
      - name: Smoke test
        env:
          URL: ${{ vars.PUBLIC_URL }}
        run: |
          curl -sf --retry 10 --retry-delay 6 --retry-all-errors "$URL/api/health"
          curl -sf "$URL/api/auth/personas" | grep -q "Rita Chen"
          curl -sf "$URL/" | grep -q "<title>FlowApprove</title>"
